<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shiv Electronics Shop</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

<header class="navbar">

    <div class="logo">
        Shiv Electronics
    </div>

    <a href="./owner.html">
        Owner Login
    </a>

</header>


<main>

<section class="hero">

    <div class="hero-content">

        <span class="small-text">
            ELECTRONICS REPAIR SERVICE
        </span>

        <h1 id="shopName">
            Shiv Electronics Shop
        </h1>

        <p id="shopDescription">
            Loading...
        </p>

        <div
            id="status"
            class="status"
        >
            Checking status...
        </div>

        <p id="address"></p>

        <a
            id="callButton"
            class="call-button"
            href="#"
        >
            Call Shop
        </a>

    </div>

    <div class="owner">

        <img
            id="ownerImage"
            src="https://via.placeholder.com/250"
            alt="Shop Owner"
        >

        <p>
            Nirjesh Kumar Gupta
        </p>

        <span>
            Shop Owner
        </span>

    </div>

</section>


<section class="services">

    <h2>
        What We Repair
    </h2>

    <p>
        भरोसेमंद इलेक्ट्रॉनिक्स रिपेयर सर्विस
    </p>

    <div
        id="servicesContainer"
        class="service-grid"
    >
    </div>

</section>


<section class="testimonials">

    <h2>
        What Customers Say
    </h2>

    <div
        id="testimonialsContainer"
        class="testimonial-grid"
    >
    </div>

</section>

</main>


<footer>

    <p>
        © 2026 Shiv Electronics Shop
    </p>

</footer>


<script src="./js/app.js"></script>

</body>
</html>
